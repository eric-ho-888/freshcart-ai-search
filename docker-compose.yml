services:
  # The Database with Vector capabilities
  postgres:
    image: ankane/pgvector:latest
    container_name: ai_search_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # The Caching Layer
  redis:
    image: redis:7-alpine
    container_name: ai_search_cache
    ports:
      - "${REDIS_PORT}:6379"
    restart: always

volumes:
  postgres_data: